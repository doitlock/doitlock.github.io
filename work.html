    } else if (s.pair) {
      cls = ' f-pair';
      size = size || 'PC · Mobile';
      const v = (dev, label) => `<figure class="${dev}"><video src="${s.pair}-${dev}.mp4" poster="${s.pair}-${dev}.jpg" muted loop playsinline preload="metadata" aria-label="${s.title} ${label} 화면 녹화"></video><figcaption>${label}</figcaption></figure>`;
      body = v('pc', 'PC') + v('mo', 'Mobile');
    } else if (s.video) {
      body = `<video src="${s.video}" poster="${s.poster || ''}" muted loop playsinline preload="metadata" aria-label="${w.name} ${s.title} 스크롤 영상"></video>`;
    } else if (s.tall) {
      cls = ' f-tall';
      body = s.tall.map((src, i) => `<img src="${src}" alt="${i === 0 ? `${w.name} ${s.title}` : ''}" loading="lazy">`).join('');
    } else if (s.src) {
      body = `<img src="${s.src}" alt="${w.name} ${s.title}" loading="lazy">`;
    } else {
      cls = ' empty'; body = '화면 캡처 자리';
    }
    return `
    <figure class="f-frame${s.narrow ? ' f-narrow' : ''}">
      <figcaption class="f-label"><span>${frameIcon}${s.title}${s.link ? ` <a class="f-link" href="${s.link}" target="_blank" rel="noopener" aria-label="${s.title} 페이지 열기">↗</a>` : ''}</span><span class="f-size" data-fixed="${size ? 1 : ''}">${size}</span></figcaption>
      <div class="f-body${cls}" style="--cols:${s.cols || 3}" ${s.tall ? 'tabindex="0" aria-label="상세페이지 전체, 스크롤해서 보기"' : ''}>${body}</div>
      ${s.desc ? `<p class="f-desc">${s.desc}</p>` : ''}
    </figure>`;
  };

  document.getElementById('detail').innerHTML = `
    <section class="d-canvas">
      <div class="frame-label">
        <span><b>Project</b> · ${pos < 0 ? '—' : `${pad(idx + 1)} / ${pad(order.length)}`}</span>
        <span class="vp" aria-hidden="true"></span>
      </div>
      <a class="back" href="./index.html#projects">← 전체 프로젝트</a>
      <p class="d-tags">${w.tags.map(t => `<span class="tag">${t}</span>`).join('')}</p>
      <div class="select-box d-title">
        <h1>${w.name}</h1>
        <span class="hd tl"></span><span class="hd tr"></span><span class="hd bl"></span><span class="hd br"></span>
        <span class="size" aria-hidden="true"></span>
      </div>
      <p class="summary">${w.summary}</p>
      <div class="d-actions">
        ${w.url ? `<a class="btn" href="${w.url}" target="_blank" rel="noopener">${w.urlLabel || '사이트 바로가기'} <span>↗</span></a>` : ''}
        <div class="toolbar" role="toolbar" aria-label="캔버스 도구">
          <button type="button" class="grid-btn" aria-pressed="false" title="12컬럼 레이아웃 그리드 보기">${gridIcon}그리드</button>
        </div>
      </div>
    </section>

    <section class="sec d-body">
      <div class="d-shots">${w.shots.map(shot).join('')}</div>
      <aside class="inspect" aria-label="프로젝트 정보">
        <p class="i-tab"><b>Properties</b></p>
        <dl>${w.meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
        <div class="i-group">
          <p class="i-title">Tech</p>
          <p class="i-chips">${w.tech.map(t => `<span>${t}</span>`).join('')}</p>
        </div>
        ${w.url ? `<div class="i-group">
          <p class="i-title">Link</p>
          <a class="i-link" href="${w.url}" target="_blank" rel="noopener">${w.url.replace(/^https?:\/\//, '').replace(/\/$/, '')} ↗</a>
        </div>` : ''}
      </aside>
    </section>

    <section class="sec band">
      <div class="sec-head">
        <div><span class="frame-name">담당 업무 ${w.tasks.length}</span><h2 class="sec-title">Role</h2></div>
      </div>
      <ul class="d-list">${w.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
      ${w.note ? `<p class="d-note">${w.note}</p>` : ''}
    </section>

    <section class="sec d-next">
      <span class="frame-name">다음 프로젝트</span>
      <a class="next" href="./work.html?id=${next.id}"><span class="name">${next.name}</span><span class="arr">→</span></a>
    </section>`;

  /* 화면 크기 · 선택 박스 · 이미지 원본 크기 표시 */
  const vp = document.querySelector('.vp');
  const box = document.querySelector('.d-title');
  const updateSize = () => {
    vp.textContent = `${innerWidth} × ${innerHeight}`;
    box.querySelector('.size').textContent = `${Math.round(box.offsetWidth)} × ${Math.round(box.offsetHeight)}`;
  };
  addEventListener('resize', updateSize);
  document.fonts.ready.then(updateSize);
  document.querySelectorAll('.f-frame').forEach(f => {
    const img = f.querySelector('img'), out = f.querySelector('.f-size');
    if (out.dataset.fixed) return;
    if (!img) { out.textContent = '비어 있음'; return; }
    const set = () => out.textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
    img.complete ? set() : img.addEventListener('load', set);
  });

  /* 스크롤 영상: 화면에 보일 때만 재생, 움직임 줄이기 설정이면 직접 재생 */
  document.querySelectorAll('.f-body video').forEach(v => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { v.controls = true; return; }
    new IntersectionObserver(([e]) => { e.isIntersecting ? v.play().catch(() => { v.controls = true; }) : v.pause(); }, { threshold: .35 }).observe(v);
  });

  /* 레이아웃 그리드 토글 */
  const gridBtn = document.querySelector('.grid-btn');
  gridBtn.addEventListener('click', () => gridBtn.setAttribute('aria-pressed', document.body.classList.toggle('show-grid')));

  /* 다음 프로젝트 커서 라벨 */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tag = document.querySelector('.cursor-tag');
  const nextLink = document.querySelector('.d-next .next');
  let tx = 0, ty = 0, x = 0, y = 0, raf;
  const loop = () => {
    x += (tx - x) * (reduce ? 1 : .25); y += (ty - y) * (reduce ? 1 : .25);
    tag.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    raf = requestAnimationFrame(loop);
  };
  nextLink.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse') return;
    x = tx = e.clientX; y = ty = e.clientY;
    tag.classList.add('on'); cancelAnimationFrame(raf); loop();
  });
  nextLink.addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; });
  nextLink.addEventListener('pointerleave', () => { tag.classList.remove('on'); setTimeout(() => cancelAnimationFrame(raf), 250); });

  /* TOP 버튼 */
  const topBtn = document.querySelector('.to-top');
  const canvas = document.querySelector('.d-canvas');
  const onScroll = () => topBtn.classList.toggle('show', scrollY > canvas.offsetHeight - 80);
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  topBtn.addEventListener('click', () => {
    scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    document.querySelector('.ide-tabs .who').focus({ preventScroll: true });
  });
</script>
</body>
</html>
